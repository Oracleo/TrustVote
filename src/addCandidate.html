<!--==========================
  Intro Section
============================-->
<section id="intro">
    <div class="intro-container wow fadeIn">
        <h1 style="text-transform: initial">Register <span>New Candidate</span></h1>
        
        <div id="loader">
            <svg class="loader" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340">
                <circle cx="170" cy="170" r="160" stroke="#E2007C"/>
                <circle cx="170" cy="170" r="135" stroke="#404041"/>
                <circle cx="170" cy="170" r="110" stroke="#E2007C"/>
                <circle cx="170" cy="170" r="85" stroke="#404041"/>
            </svg>
        </div>

        <div id="content" style="display: none; background-color: rgba(255, 255, 255, 0.96); color: #2f3138; padding: 25px 30px; border-radius: 8px; max-width: 650px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.3); text-align: left;">
            
            <div class="row" style="margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px;">
                <div class="col-md-7">
                    <span style="font-size: 13px; font-weight: 600; color: #555;">Connected Wallet:</span><br/>
                    <span id="accountAddress" style="font-size: 12px; font-family: monospace; word-break: break-all;"></span>
                </div>
                <div class="col-md-5 text-right">
                    <span id="roleBadge"></span>
                    <span id="electionStateBadge" style="margin-left: 5px;"></span>
                </div>
            </div>

            <!-- Admin Transaction Status Feedback -->
            <div id="adminTxStatus"></div>

            <form class="addCandidateForm" onSubmit="App.addCandidate(); return false;">
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="candidateName" style="font-weight: 600; color: #0e1b4d;">Candidate Full Name:</label>
                    <input type="text" class="form-control" id="candidateName" placeholder="e.g. Eleanor Vance" required>
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="candidateParty" style="font-weight: 600; color: #0e1b4d;">Political Party / Affiliation:</label>
                    <input type="text" class="form-control" id="candidateParty" placeholder="e.g. National Transparency Front" required>
                </div>

                <button type="submit" class="btn btn-block" style="background-color: #f82249; color: white; padding: 10px; font-weight: 700; width: 100%;">
                    Submit Candidate to Blockchain
                </button>
            </form>

            <div style="margin-top: 15px; text-align: center;">
                <a href="admin.html" style="font-size: 13px; color: #0e1b4d;">&larr; Back to Admin Panel</a>
            </div>

            <div style="background-color: #f8f9fa; border-left: 3px solid #f82249; padding: 8px 12px; font-size: 11px; color: #666; margin-top: 15px;">
                <strong>Contract Requirement:</strong> Candidates can only be registered during the Registration Phase by the election admin address.
            </div>

        </div>
    </div>
</section>
